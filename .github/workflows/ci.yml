name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        run: find src/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Confirmar entrada publicável
        run: test -f index.html && test -f src/pages/index.html
